version: 2

sources:
  # ===========================================
  # Base EVM Source (transactions, blocks etc.)
  # ===========================================
  - name: arc
    description: >
      Raw EVM tables for the Arc chain. Only the tables the token transfer spells read are
      declared today; add further raw tables here as spells start using them.
    tables:
      # tokens_arc_base_transfers reads no traces on purpose: Arc implements EIP-7708, so every
      # native value movement is logged as a Transfer event from the system emitter and arrives
      # on erc20_arc.evt_Transfer. That stream is a complete native record, so the transfers
      # model has no traces leg to read -- reading both would double count. See the comments in
      # that model. The traces table below is declared for call-level spells (1inch raw calls),
      # not for native transfer accounting.
      - name: transactions
        description: "Transactions executed on Arc: sender, receiver, value, gas, status and input data."
        columns:
          - name: block_date
            description: "The UTC date of the block in which this transaction was included"
          - name: block_time
            description: "The exact UTC timestamp when the block containing this transaction was mined/sequenced"
          - name: block_number
            description: "The sequential number (height) of the block containing this transaction"
          - name: hash
            description: "The unique 32-byte identifier (hash) of this transaction"
          - name: index
            description: "The transaction's position (index) within its block"
          - name: from
            description: "The address that initiated (signed and sent) the transaction"
          - name: to
            description: "The recipient address of the transaction (contract or EOA); null for contract creations"
          - name: value
            description: "Amount of the native gas token sent with the transaction, in its smallest unit"
          - name: success
            description: "Boolean indicating whether the transaction executed successfully"

      - name: traces
        description: "Represents internal operations or execution steps within a transaction (e.g., contract calls, creations). Traces form a tree structure for each transaction."
        columns:
          - name: block_date
            description: "The UTC date of the block in which this trace was included"
          - name: block_time
            description: "The exact UTC timestamp when the block containing this trace was mined/sequenced"
          - name: block_number
            description: "The sequential number (height) of the block containing this trace"
          - name: value
            description: "Amount of the native gas token transferred in this trace, in its smallest unit"
          - name: gas
            description: "Amount of gas allocated for this trace's execution (may include gas for sub-traces)"
          - name: gas_used
            description: "Actual amount of gas consumed by this specific trace step"
          - name: success
            description: "Boolean flag indicating if this specific trace step executed successfully (true) or reverted (false)"
          - name: tx_index
            description: "Index of the parent transaction within its containing block"
          - name: subtraces
            description: "Number of direct child traces initiated by this trace"
          - name: error
            description: "Error message or reason if this trace step failed/reverted"
          - name: tx_success
            description: "Boolean flag indicating the success status of the parent transaction"
          - name: tx_hash
            description: "Unique 256-bit identifier (hash) of the parent transaction"
          - name: from
            description: "Address initiating this trace step (caller)"
          - name: to
            description: "Address receiving this trace step (callee)"
          - name: trace_address
            description: "Array representing the path from the root trace to this trace within the execution tree"
          - name: type
            description: "Type of trace action (e.g., 'call', 'staticcall', 'delegatecall', 'create', 'suicide')"
          - name: address
            description: "Address associated with the trace action (e.g., newly created contract address)"
          - name: code
            description: "Bytecode of the contract being created"
          - name: call_type
            description: "Specific type of call operation (e.g., 'call', 'delegatecall', 'staticcall')"
          - name: input
            description: "Input data provided for this trace step (e.g., function arguments for a call)"
          - name: output
            description: "Output data returned by this trace step"

      # Read by uniswap_v4_aggregator_hooks, which scans deployed bytecode to detect
      # BaseAggregatorHook contracts. Contract creations only, not the full trace stream.
      - name: creation_traces
        description: "One row per contract creation on Arc: the created address, its creator, and its deployed bytecode."
        columns:
          - name: block_time
            description: "The exact UTC timestamp when the block containing this creation was mined/sequenced"
          - name: block_number
            description: "The sequential number (height) of the block containing this creation"
          - name: tx_hash
            description: "Hash of the transaction that created the contract"
          - name: address
            description: "Address of the contract created"
          - name: from
            description: "Address that created this contract. Can be a contract or EOA."
          - name: code
            description: "Deployed bytecode of the contract"

  # ===========================================
  # ERC20 Source
  # ===========================================
  - name: erc20_arc
    description: >
      Standard ERC20 fungible token event tables for Arc. Also carries the EIP-7708 system
      emitter at 0xfffffffffffffffffffffffffffffffffffffffe, whose Transfer logs are Arc's
      complete record of native value movement.
    tables:
      - name: evt_Transfer
        description: >
          ERC20 Transfer events on Arc, including the EIP-7708 system-emitter logs that stand
          in for the traces leg every other EVM chain uses for native transfers.
        columns:
          - name: contract_address
            description: "Address of the ERC20 token contract that emitted this event; 0xffff...fffe for the EIP-7708 system emitter"
          - name: evt_tx_hash
            description: "Hash of the transaction containing this event"
          - name: evt_index
            description: "Index position of this event within the transaction"
          - name: evt_block_time
            description: "Timestamp of the block containing this event"
          - name: evt_block_number
            description: "The block number containing this event"
          - name: from
            description: "Sender of the tokens; the address debited by the movement"
          - name: to
            description: "Recipient of the tokens; the address credited by the movement"
          - name: value
            description: "Amount transferred, in the emitting interface's own decimals (18 for the system emitter)"
