name: Claude

on:
  pull_request:
    # No "opened": pr_automation.yml turns every new PR into a draft, so review starts at ready_for_review.
    types: [ready_for_review, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  checks: read
  statuses: read
  id-token: write

jobs:
  claude:
    # Public repository: PRs from forks get no secrets or OIDC token, so they are skipped.
    # Org members can still run "@claude review" on any PR.
    if: github.event_name == 'issue_comment' || github.event.pull_request.head.repo.full_name == github.repository
    uses: duneanalytics/actions/.github/workflows/claude.yml@main
    with:
      # The self-hosted runner group does not allow public repositories.
      runs-on: '"ubuntu-latest"'
      auto-approve: true
      dry-run: true
      deny-paths: |
        .github/*
        AGENTS.md
        CLAUDE.md
        */AGENTS.md
        */CLAUDE.md
      ci-timeout-minutes: 60
      allowed-bots: dependabot[bot]
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SIETCH_APP_PRIVATE_KEY: ${{ secrets.SIETCH_APP_PRIVATE_KEY }}
