version: 2

models:
  - name: cow_protocol_robinhood_solvers
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - address
    meta:
      blockchain: robinhood
      project: cow_protocol
    config:
      tags: ["robinhood", "cow_protocol", "solver"]
    description: >
      CoW Protocol solvers list on Robinhood
    columns:
      - name: address
        description: "Solver address on the allow-list"
        data_tests:
          - not_null

  - name: cow_protocol_robinhood_batches
    meta:
      blockchain: robinhood
      project: cow_protocol
    config:
      tags: ["robinhood", "cow_protocol", "trades", "dex", "aggregator", "auction"]
    description: >
      CoW Protocol enriched batches table on Robinhood
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - block_date
              - tx_hash
    columns:
      - name: block_date
        description: "UTC day of the settlement transaction"
        data_tests:
          - not_null
      - name: tx_hash
        description: "Settlement transaction hash"
        data_tests:
          - not_null

  - name: cow_protocol_robinhood_eth_flow_orders
    meta:
      blockchain: robinhood
      project: cow_protocol
    config:
      tags: [ "robinhood", "cow_protocol", "eth-flow", "orders"]
    description: >
      ETHFlow enables the sale of Native ETH via CoW Protocol. This works essentially by placing an (onchain) order,
      through the ETHFlow contract (https://github.com/cowprotocol/ethflowcontract) sending native which then wraps
      the asset as an ERC20. The order is filled through this intermediary contract that uses ERC1271 signature
      verification to place the order on the user's behalf.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - block_month
              - tx_hash
              - order_uid
    columns:
      - name: block_month
        description: "UTC month of the order placement"
        data_tests:
          - not_null
      - name: tx_hash
        description: "Order placement transaction hash"
        data_tests:
          - not_null
      - name: order_uid
        description: "CoW Protocol order uid"
        data_tests:
          - not_null
