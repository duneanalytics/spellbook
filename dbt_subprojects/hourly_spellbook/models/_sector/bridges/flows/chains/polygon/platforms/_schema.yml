version: 2

models:
  - name: bridges_polygon_cctp_v1_deposits
    meta:
      blockchain: polygon
      sector: bridges
      project: cctp
    config:
      tags: [ 'polygon', 'bridges', 'flows', 'deposits' ]
    description: "Circle's CCTP v1 bridge deposits events on Polygon"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['tx_hash','evt_index']
      - equal_rowcount_with_sources:
          arguments:
            evt_sources:
              - source('circle_polygon','tokenmessenger_evt_depositforburn')
