version: 2

models:
  - name: tokens_xlayer_net_transfers_daily
    meta:
      blockchain: xlayer
      sector: tokens
      contributors: tomfutago
    config:
      tags: ['tokens', 'net_transfers', 'daily']
    description: "Total transfer amount per day"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - blockchain
              - block_date

