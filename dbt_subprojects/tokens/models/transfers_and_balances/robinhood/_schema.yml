version: 2

models:
  - name: tokens_robinhood_net_transfers_daily
    meta:
      blockchain: robinhood
      sector: tokens
      contributors: 0xRob
    config:
      tags: ['tokens', 'net_transfers', 'daily']
    description: "Total transfer amount per day on Robinhood"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - blockchain
              - block_date

  - name: tokens_robinhood_net_transfers_daily_asset
    meta:
      blockchain: robinhood
      sector: tokens
      contributors: 0xRob
    config:
      tags: ['tokens', 'net_transfers']
    description: "Total transfer amount per day per asset on Robinhood"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - blockchain
              - block_date
              - contract_address
