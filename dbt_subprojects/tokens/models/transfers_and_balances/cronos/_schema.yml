version: 2

models:
  - name: tokens_cronos_net_transfers_daily
    meta:
      blockchain: cronos
      sector: tokens
      contributors: jeff-dude
    config:
      tags: ['tokens', 'net_transfers', 'daily']
    description: "Total transfer amount per day"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - blockchain
              - block_date
    columns:
      - name: blockchain
        description: "The blockchain of the transfers"
        data_tests:
          - not_null
      - name: block_date
        description: "The date of the block"
        data_tests:
          - not_null

  - name: tokens_cronos_net_transfers_daily_asset
    meta:
      blockchain: cronos
      sector: tokens
      contributors: jeff-dude
    config:
      tags: ['tokens', 'net_transfers']
    description: "Total transfer amount per day per asset"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - blockchain
              - block_date
              - contract_address
    columns:
      - name: blockchain
        description: "The blockchain of the transfers"
        data_tests:
          - not_null
      - name: block_date
        description: "The date of the block"
        data_tests:
          - not_null
      - name: contract_address
        description: "The contract address of the transfer"
        data_tests:
          - not_null
