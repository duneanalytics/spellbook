version: 2

models:
  - name: addresses_events_arc_first_funded_by
    description: "First native-token funding per Arc address, ordered by block, transaction, and event index."
    meta:
      blockchain: arc
      contributors: karimhass
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [blockchain, address]
    columns:
      - name: blockchain
        description: "Blockchain name."
        data_tests: [not_null]
      - name: address
        description: "Address receiving native funds."
        data_tests: [not_null]
      - name: first_funded_by
        description: "Sender of the first native transfer."
      - name: block_time
        description: "Block timestamp of the first native transfer."
