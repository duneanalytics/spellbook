version: 2

models:
  - name: dex_arc_trades
    data_tests:
      - check_columns_dex_trades
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - blockchain
              - project
              - version
              - tx_hash
              - evt_index
      - dbt_utils.accepted_range:
          arguments:
            column_name: amount_usd
            max_value: 1000000000 # $1b is an arbitrary number, intended to flag outlier amounts early

  - name: dex_arc_base_trades

  - name: uniswap_v2_arc_base_trades
    meta:
      blockchain: arc
      sector: dex
      project: uniswap
      contributors: ['0xRob']
    config:
      tags: [ 'arc', 'dex', 'trades', 'uniswap', 'v2' ]
    description: "uniswap arc v2 base trades"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - tx_hash
              - evt_index

  - name: uniswap_v3_arc_base_trades
    meta:
      blockchain: arc
      sector: dex
      project: uniswap
      contributors: ['0xRob']
    config:
      tags: [ 'arc', 'dex', 'trades', 'uniswap', 'v3' ]
    description: "uniswap arc v3 base trades"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - tx_hash
              - evt_index

  - name: uniswap_v4_arc_base_trades
    meta:
      blockchain: arc
      sector: dex
      project: uniswap
      contributors: ['0xRob']
    config:
      tags: [ 'arc', 'dex', 'trades', 'uniswap', 'v4' ]
    description: "uniswap arc v4 base trades"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - tx_hash
              - evt_index
