version: 2

models:
  - name: dex_ethereum_trades
    data_tests:
      - check_columns_dex_trades
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - blockchain
              - project
              - version
              - tx_hash
              - evt_index
      - dbt_utils.accepted_range:
          arguments:
            column_name: amount_usd
            max_value: 1000000000 # $1b is an arbitrary number, intended to flag outlier amounts early

  - name: dex_ethereum_base_trades
  - name: zeroex_settler_ethereum_base_trades
    meta:
      blockchain: ethereum
      sector: dex
      project: 0x API
    config:
      tags: ["ethereum", "dex", "trades", "zeroex", "settler"]
    description: "0x Settler plain-RFQ (action 0xd92aadfb) PMM base trades on ethereum"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - tx_hash
              - evt_index
      - check_dex_base_trades_seed:
          arguments:
            seed_file: ref('zeroex_settler_ethereum_base_trades_seed')
    columns:
      - name: tx_hash
        data_tests:
          - not_null
      - name: evt_index
        data_tests:
          - not_null
