version: 2

models:
  - name: dex_optimism_trades
    data_tests:
      - check_columns_dex_trades
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - blockchain
              - project
              - version
              - tx_hash
              - evt_index
      - dbt_utils.accepted_range:
          arguments:
            column_name: amount_usd
            max_value: 1000000000 # $1b is an arbitrary number, intended to flag outlier amounts early

  - name: dex_optimism_base_trades

  - name: uniswap_v4_optimism_base_trades
    meta:
      blockchain: optimism
      sector: dex
      project: uniswap
    config:
      tags: [ 'optimism', 'dex', 'trades', 'uniswap', 'v4' ]
    description: "uniswap optimism v4 base trades"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - tx_hash
              - evt_index
      - check_dex_base_trades_seed:
          arguments:
            seed_file: ref('uniswap_optimism_base_trades_seed')
            filter:
              version: 4

