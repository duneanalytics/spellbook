version: 2

models:
  - name: cleave_base_trades
    meta:
      blockchain: ethereum, optimism, arbitrum, base, bnb, polygon
      sector: dex_aggregator
      project: cleave
      contributors: cleave-protocol
    config:
      tags: ['ethereum', 'optimism', 'arbitrum', 'base', 'bnb', 'polygon', 'cleave', 'trades', 'dex', 'aggregator', 'cross-chain']
    description: >
      Cleave Protocol aggregator base trades on all chains. A swap routed over many pools and paths is one row.
      Swaps that Cleave executes on each chain of a swap between chains are included as trades on that chain;
      the transfer between chains itself is not a trade. This table loads dex_aggregator.trades downstream.
    columns:
      - name: blockchain
        description: "Blockchain which the DEX aggregator is deployed"
      - name: project
        description: "Project name of the DEX aggregator"
      - name: version
        description: "Version of the Cleave swap contract: 1 for SwapExecuted events, 2 for MeasuredSwapV1 events"
      - name: block_month
        description: "UTC event block month of each DEX trade"
      - name: block_date
        description: "UTC event block date of each DEX trade"
      - name: block_time
        description: "UTC event block time of each DEX trade"
      - name: token_bought_amount_raw
        description: "Raw amount of the token bought, delivered to the recipient (measured for version 2)"
      - name: token_sold_amount_raw
        description: "Raw amount of the token sold, paid by the payer (measured for version 2)"
      - name: token_bought_address
        description: "Contract address of the token bought"
      - name: token_sold_address
        description: "Contract address of the token sold"
      - name: taker
        description: "Version 1: the transaction sender; for swaps executed on delivery from another chain this is the delivering relayer. Version 2: the payer when the payer sent the transaction or the swap feeds a transfer to another chain, otherwise the recipient"
      - name: maker
        description: "Always null for aggregator trades"
      - name: project_contract_address
        description: "Cleave swap contract that emitted the event"
      - name: tx_hash
        description: "Unique transaction hash value tied to each transaction on the DEX aggregator"
      - name: tx_from
        description: "Address which initiated the transaction"
      - name: tx_to
        description: "Address which received the transaction"
      - name: trace_address
        description: "Always [-1], rows are sourced from event logs"
      - name: evt_index
        description: "The position of this event log within this transaction"
