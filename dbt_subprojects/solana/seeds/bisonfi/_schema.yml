version: 2

seeds:
  - name: bisonfi_solana_base_trades_seed
    description: >
      BisonFi swaps from 2026-11-22, one per covered instruction: two 0x13 calls (signed-quote swaps
      routed by OKX), one 0x07 and one 0x02. Expected mints and amounts are the token transfers at
      inner index +1 (sold) and +2 (bought) after the BisonFi call.
    config:
      column_types:
        block_month: date
        block_date: date
        tx_id: varchar
        outer_instruction_index: integer
        inner_instruction_index: integer
        token_sold_amount_raw: uint256
        token_bought_amount_raw: uint256
        token_sold_mint_address: varchar
        token_bought_mint_address: varchar
        project_program_id: varchar
