version: 2

models:
  - name: quantum_solana_stg_raw_swaps
    meta:
      blockchain: solana
      contributors: [ 0xRobin ]
    config:
      tags: [ 'solana', 'dex', 'quantum' ]
    description: Staging model for Quantum swap data from instruction_calls.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ 'block_month', 'block_date', 'surrogate_key' ]

  - name: quantum_solana_base_trades
    meta:
      blockchain: solana
      contributors: [ 0xRobin ]
    config:
      tags: [ 'solana', 'dex', 'quantum' ]
    description: Quantum DEX base trades on Solana.
    data_tests:
      - check_columns_solana_dex_trades
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ 'block_month', 'block_date', 'surrogate_key' ]

  - name: quantum_solana_trades
    meta:
      blockchain: solana
      contributors: [ 0xRobin ]
    config:
      tags: [ 'solana', 'dex', 'quantum' ]
    description: Quantum DEX trades on Solana (from dex_solana_trades).
