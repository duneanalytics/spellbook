version: 2

models:
  - name: byreal_solana_stg_raw_swaps
    meta:
      blockchain: solana
    config:
      tags: [ 'solana', 'dex', 'byreal' ]
    description: Staging model for Byreal swap data from instruction_calls.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ 'block_month', 'block_date', 'surrogate_key' ]

  - name: byreal_solana_base_trades
    meta:
      blockchain: solana
    config:
      tags: [ 'solana', 'dex', 'byreal' ]
    description: Byreal DEX base trades on Solana.
    data_tests:
      - check_columns_solana_dex_trades
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ 'block_month', 'block_date', 'surrogate_key' ]
      - check_seed:
          arguments:
            seed_file: ref('byreal_solana_base_trades_seed')
            match_columns: [ 'block_month', 'block_date', 'surrogate_key' ]
            check_columns: [ 'tx_id', 'project_program_id', 'token_sold_mint_address', 'token_bought_mint_address', 'token_sold_amount_raw', 'token_bought_amount_raw' ]

  - name: byreal_solana_trades
    meta:
      blockchain: solana
    config:
      tags: [ 'solana', 'dex', 'byreal' ]
    description: Byreal DEX trades on Solana (from dex_solana_trades).
